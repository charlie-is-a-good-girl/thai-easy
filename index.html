<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Easy - 成人泰語即時學習與翻譯助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DICTIONARY_DATABASE = [
            {
                thai: "สวัสดีครับ",
                roman: "sà-wàt-dee kráp",
                zh: "你好（男性客氣用語）",
                en: "Hello (polite male)",
                words: [
                    { thai: "สวัสดี", roman: "sà-wàt-dee", tone: "Low - Mid", pos: "感嘆詞", zh: "你好", en: "Hello" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "男性敬語助詞", en: "Polite particle (male)" }
                ]
            },
            {
                thai: "สวัสดีค่ะ",
                roman: "sà-wàt-dee kâ",
                zh: "你好（女性客氣用語）",
                en: "Hello (polite female)",
                words: [
                    { thai: "สวัสดี", roman: "sà-wàt-dee", tone: "Low - Mid", pos: "感嘆詞", zh: "你好", en: "Hello" },
                    { thai: "ค่ะ", roman: "kâ", tone: "Falling", pos: "語氣詞", zh: "女性敬語助詞", en: "Polite particle (female)" }
                ]
            },
            {
                thai: "ขอบคุณมากครับ",
                roman: "kɔ̀ɔp-kun mâak kráp",
                zh: "非常感謝你",
                en: "Thank you very much",
                words: [
                    { thai: "ขอบคุณ", roman: "kɔ̀ɔp-kun", tone: "Low - Mid", pos: "動詞", zh: "感謝", en: "Thank" },
                    { thai: "มาก", roman: "mâak", tone: "Falling", pos: "副詞", zh: "非常/很多", en: "Very/Much" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "男性敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "เท่าไหร่ครับ",
                roman: "tâo-rài kráp",
                zh: "這個多少錢？",
                en: "How much is this?",
                words: [
                    { thai: "เท่าไหร่", roman: "tâo-rài", tone: "Falling - Low", pos: "疑問詞", zh: "多少錢", en: "How much" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "敬語助詞", en: "Polite particle" }
                ]
            }
        ];

        function App() {
            const [inputText, setInputText] = useState('สวัสดีครับ');
            const [result, setResult] = useState(DICTIONARY_DATABASE[0]);

            useEffect(() => {
                const found = DICTIONARY_DATABASE.find(item => item.thai.includes(inputText) || item.zh.includes(inputText));
                if (found) {
                    setResult(found);
                } else {
                    setResult({
                        thai: inputText,
                        roman: "phâa-sǎa-thai (自訂輸入)",
                        zh: `即時分析：${inputText}`,
                        en: `Analysis for ${inputText}`,
                        words: [{ thai: inputText, roman: "roman", tone: "Mid", pos: "詞組", zh: inputText, en: inputText }]
                    });
                }
            }, [inputText]);

            const speak = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'th-TH';
                    window.speechSynthesis.speak(utterance);
                }
            };

            return (
                <div className="max-w-3xl mx-auto px-4 py-8">
                    <header className="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-amber-400 flex items-center justify-center text-slate-950 font-black text-xl">泰</div>
                            <div>
                                <h1 className="text-xl font-black text-white">Thai Easy</h1>
                                <p className="text-xs text-slate-400">成人泰語即時翻譯工具</p>
                            </div>
                        </div>
                    </header>

                    {/* 輸入框 */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 mb-6 shadow-xl">
                        <label className="text-xs text-slate-400 block mb-2 font-medium">請輸入泰文或中文：</label>
                        <div className="relative">
                            <input 
                                type="text"
                                value={inputText}
                                onChange={(e) => setInputText(e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-lg text-white focus:outline-none focus:border-amber-400"
                                placeholder="輸入文字..."
                            />
                        </div>
                    </div>

                    {/* 結果顯示 */}
                    {result && (
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <span className="text-xs font-bold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-full">泰文原文</span>
                                    <h2 className="text-3xl font-black text-white mt-2">{result.thai}</h2>
                                    <p className="text-amber-300 font-mono text-sm mt-1">{result.roman}</p>
                                </div>
                                <button 
                                    onClick={() => speak(result.thai)}
                                    className="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2"
                                >
                                    <span>🔊 播放發音</span>
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4 border-t border-slate-800">
                                <div className="bg-slate-950 p-3.5 rounded-xl">
                                    <span className="text-xs text-slate-500 block mb-1">中文翻譯</span>
                                    <p className="text-slate-100 font-semibold">{result.zh}</p>
                                </div>
                                <div className="bg-slate-950 p-3.5 rounded-xl">
                                    <span className="text-xs text-slate-500 block mb-1">英文翻譯</span>
                                    <p className="text-slate-300">{result.en}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
