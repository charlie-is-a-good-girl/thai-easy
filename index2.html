<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Easy - 成人泰語即時學習與翻譯助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVGs 簡易圖標元件 ---
        const IconSearch = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
        const IconVolume = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>;
        const IconBookmark = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>;
        const IconBookmarkCheck = () => <svg className="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
        const IconCopy = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>;

        // --- 資料庫 ---
        const DICTIONARY_DATABASE = [
            {
                thai: "สวัสดีครับ",
                roman: "sà-wàt-dee kráp",
                zh: "你好（男性客氣用語）",
                en: "Hello (polite male)",
                words: [
                    { thai: "สวัสดี", roman: "sà-wàt-dee", tone: "Low - Mid", pos: "感嘆詞", zh: "你好", en: "Hello" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "男性敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "สวัสดีค่ะ",
                roman: "sà-wàt-dee kâ",
                zh: "你好（女性客氣用語）",
                en: "Hello (polite female)",
                words: [
                    { thai: "สวัสดี", roman: "sà-wàt-dee", tone: "Low - Mid", pos: "感嘆詞", zh: "你好", en: "Hello" },
                    { thai: "ค่ะ", roman: "kâ", tone: "Falling", pos: "語氣詞", zh: "女性敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "ขอบคุณมากครับ",
                roman: "kɔ̀ɔp-kun mâak kráp",
                zh: "非常感謝你",
                en: "Thank you very much",
                words: [
                    { thai: "ขอบคุณ", roman: "kɔ̀ɔp-kun", tone: "Low - Mid", pos: "動詞", zh: "感謝", en: "Thank" },
                    { thai: "มาก", roman: "mâak", tone: "Falling", pos: "副詞", zh: "非常/很多", en: "Very/Much" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "男性敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "เท่าไหร่ครับ",
                roman: "tâo-rài kráp",
                zh: "這個多少錢？",
                en: "How much is this?",
                words: [
                    { thai: "เท่าไหร่", roman: "tâo-rài", tone: "Falling - Low", pos: "疑問詞", zh: "多少錢", en: "How much" },
                    { thai: "ครับ", roman: "kráp", tone: "High", pos: "語氣詞", zh: "敬語助詞", en: "Polite particle" }
                ]
            },
            {
                thai: "ห้องน้ำอยู่ที่ไหน",
                roman: "hɔ̂ɔng-nám yùu tîi-nǎi",
                zh: "洗手間在哪裡？",
                en: "Where is the restroom?",
                words: [
                    { thai: "ห้องน้ำ", roman: "hɔ̂ɔng-nám", tone: "Falling - High", pos: "名詞", zh: "洗手間/廁所", en: "Restroom" },
                    { thai: "อยู่", roman: "yùu", tone: "Low", pos: "動詞", zh: "在", en: "To be at" },
                    { thai: "ที่ไหน", roman: "tîi-nǎi", tone: "Falling - Rising", pos: "疑問詞", zh: "哪裡", en: "Where" }
                ]
            }
        ];

        const CONSONANTS = [
            { char: "ก", name: "ก ไก่", class: "中輔音", init: "k", final: "k", mean: "雞" },
            { char: "ข", name: "ข ไข่", class: "高輔音", init: "kh", final: "k", mean: "蛋" },
            { char: "ค", name: "ค ควาย", class: "低輔音", init: "kh", final: "k", mean: "水牛" },
            { char: "จ", name: "จ จาน", class: "中輔音", init: "ch/j", final: "t", mean: "盤子" },
            { char: "ด", name: "ด เด็ก", class: "中輔音", init: "d", final: "t", mean: "小孩" },
            { char: "ต", name: "ต เต่า", class: "中輔音", init: "t", final: "t", mean: "烏龜" },
            { char: "น", name: "น หนู", class: "低輔音", init: "n", final: "n", mean: "老鼠" },
            { char: "บ", name: "บ ใบไม้", class: "中輔音", init: "b", final: "p", mean: "樹葉" },
            { char: "ป", name: "ป ปลา", class: "中輔音", init: "p", final: "p", mean: "魚" },
            { char: "ม", name: "ม ม้า", class: "低輔音", init: "m", final: "m", mean: "馬" }
        ];

        const CATEGORIZED_PHRASES = [
            {
                category: "✈️ 旅遊交通",
                items: [
                    { thai: "สนามบินอยู่ที่ไหน", roman: "sa-nǎam-bin yùu tîi-nǎi", zh: "機場在哪裡？" },
                    { thai: "ไปสยามพารากอนครับ", roman: "pai sa-yǎam phaa-raa-kon kráp", zh: "請帶我去 Siam Paragon" },
                    { thai: "เปิดมิเตอร์ด้วยครับ", roman: "pə̀ət mi-tə̂ə dûai kráp", zh: "請跳錶計費" }
                ]
            },
            {
                category: "🍽️ 餐飲夜生活",
                items: [
                    { thai: "ขอเมนูหน่อยครับ", roman: "khɔ̌ɔ mee-nuu nɔ̀ɔi kráp", zh: "請給我菜單" },
                    { thai: "ไม่เผ็ดครับ", roman: "mâi phet kráp", zh: "不要辣" },
                    { thai: "เช็คบิลด้วยครับ", roman: "chék bin dûai kráp", zh: "請幫我結帳" }
                ]
            }
        ];

        const TONE_GUIDES = [
            { name: "Mid Tone (平聲)", mark: "無標記", pitch: "33 中平", sample: "มา (來)" },
            { name: "Low Tone (低聲)", mark: "̀ (màa)", pitch: "21 低降", sample: "ม่า (麻)" },
            { name: "Falling Tone (落聲)", mark: "̂ (mâa)", pitch: "51 高降", sample: "ม้า (馬)" },
            { name: "High Tone (高聲)", mark: "́ (máa)", pitch: "45 高升", sample: "ค้า (買賣)" },
            { name: "Rising Tone (升聲)", mark: "̌ (mǎa)", pitch: "14 低升", sample: "หมา (狗)" }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('translator');
            const [inputText, setInputText] = useState('สวัสดีครับ');
            const [analysisResult, setAnalysisResult] = useState(DICTIONARY_DATABASE[0]);
            const [speechRate, setSpeechRate] = useState(0.85);
            const [savedItems, setSavedItems] = useState([]);
            const [toast, setToast] = useState('');

            useEffect(() => {
                const stored = localStorage.getItem('thai_easy_notes');
                if (stored) setSavedItems(JSON.parse(stored));
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 2500);
            };

            useEffect(() => {
                const found = DICTIONARY_DATABASE.find(item => item.thai.includes(inputText) || item.zh.includes(inputText));
                if (found) {
                    setAnalysisResult(found);
                } else {
                    setAnalysisResult({
                        thai: inputText,
                        roman: "sà-wàt-dee (即時分析)",
                        zh: `「${inputText}」即時翻譯`,
                        en: `Translation for ${inputText}`,
                        words: [
                            { thai: inputText, roman: "roman", tone: "Mid", pos: "詞組", zh: inputText, en: inputText }
                        ]
                    });
                }
            }, [inputText]);

            const speak = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'th-TH';
                    u.rate = speechRate;
                    window.speechSynthesis.speak(u);
                }
            };

            const toggleSaveWord = (word) => {
                const exists = savedItems.some(i => i.type === 'word' && i.thai === word.thai);
                let updated;
                if (exists) {
                    updated = savedItems.filter(i => !(i.type === 'word' && i.thai === word.thai));
                    showToast('已移除單字');
                } else {
                    updated = [{ id: Date.now(), type: 'word', ...word }, ...savedItems];
                    showToast('已收藏單字！');
                }
                setSavedItems(updated);
                localStorage.setItem('thai_easy_notes', JSON.stringify(updated));
            };

            const toggleSaveSentence = () => {
                if (!analysisResult) return;
                const exists = savedItems.some(i => i.type === 'sentence' && i.thai === analysisResult.thai);
                let updated;
                if (exists) {
                    updated = savedItems.filter(i => !(i.type === 'sentence' && i.thai === analysisResult.thai));
                    showToast('已移除句子');
                } else {
                    updated = [{ id: Date.now(), type: 'sentence', thai: analysisResult.thai, roman: analysisResult.roman, zh: analysisResult.zh }, ...savedItems];
                    showToast('已收藏句子！');
                }
                setSavedItems(updated);
                localStorage.setItem('thai_easy_notes', JSON.stringify(updated));
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-6">
                    {/* Toast */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-full shadow-lg text-sm animate-bounce">
                            ✨ {toast}
                        </div>
                    )}

                    {/* Header */}
                    <header className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-amber-400 flex items-center justify-center text-slate-950 font-black text-xl">泰</div>
                            <div>
                                <h1 className="text-xl font-black text-white">Thai Easy</h1>
                                <p className="text-xs text-slate-400">成人泰語即時學習與翻譯助手</p>
                            </div>
                        </div>
                        <div className="text-xs text-slate-400">已收藏 <span className="text-amber-400 font-bold">{savedItems.length}</span> 項</div>
                    </header>

                    {/* Tabs */}
                    <div className="flex gap-2 overflow-x-auto pb-2 mb-6 border-b border-slate-800">
                        {[
                            { id: 'translator', label: '⚡ 即時翻譯' },
                            { id: 'alphabet', label: '🔤 字母學習' },
                            { id: 'phrases', label: '💬 實用短句' },
                            { id: 'tones', label: '🎵 聲調圖解' },
                            { id: 'saved', label: `🔖 標記筆記 (${savedItems.length})` }
                        ].map(t => (
                            <button
                                key={t.id}
                                onClick={() => setActiveTab(t.id)}
                                className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all ${
                                    activeTab === t.id ? 'bg-amber-400 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'
                                }`}
                            >
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {/* TAB 1: TRANSLATOR */}
                    {activeTab === 'translator' && (
                        <div className="space-y-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                                <label className="text-xs text-slate-400 block mb-2 font-medium">請輸入泰文或中文：</label>
                                <textarea
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    rows={2}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-white text-lg focus:outline-none focus:border-amber-400 resize-none"
                                    placeholder="輸入想翻譯的文字..."
                                />
                                <div className="flex items-center justify-between mt-3 pt-3 border-t border-slate-800 text-xs">
                                    <div className="flex gap-1">
                                        {[0.5, 0.75, 1.0].map(r => (
                                            <button
                                                key={r}
                                                onClick={() => setSpeechRate(r)}
                                                className={`px-2.5 py-1 rounded-lg font-bold ${speechRate === r ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                                            >
                                                {r}x
                                            </button>
                                        ))}
                                    </div>
                                    <button
                                        onClick={() => speak(inputText)}
                                        className="bg-amber-400 hover:bg-amber-300 text-slate-950 px-4 py-2 rounded-xl font-bold flex items-center gap-1.5"
                                    >
                                        <IconVolume /> 朗讀整句
                                    </button>
                                </div>
                            </div>

                            {analysisResult && (
                                <div className="space-y-6">
                                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-1.5 h-full bg-amber-400"></div>
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <span className="text-xs text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-full font-bold">泰文原文</span>
                                                <h2 className="text-3xl font-black text-white mt-2">{analysisResult.thai}</h2>
                                                <p className="text-amber-300 font-mono text-sm mt-1">{analysisResult.roman}</p>
                                            </div>
                                            <button
                                                onClick={toggleSaveSentence}
                                                className={`p-3 rounded-2xl border ${savedItems.some(i => i.thai === analysisResult.thai) ? 'bg-amber-400/20 border-amber-400 text-amber-400' : 'bg-slate-800 border-slate-700 text-slate-300'}`}
                                            >
                                                <IconBookmark />
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4 border-t border-slate-800">
                                            <div className="bg-slate-950 p-3.5 rounded-xl"><span className="text-xs text-slate-500 block">中文翻譯</span><p className="text-slate-100 font-semibold">{analysisResult.zh}</p></div>
                                            <div className="bg-slate-950 p-3.5 rounded-xl"><span className="text-xs text-slate-500 block">English</span><p className="text-slate-300">{analysisResult.en}</p></div>
                                        </div>
                                    </div>

                                    {/* Breakdown */}
                                    {analysisResult.words && (
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-300 mb-3">逐字拆解與單字收藏</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {analysisResult.words.map((w, idx) => {
                                                    const saved = savedItems.some(i => i.type === 'word' && i.thai === w.thai);
                                                    return (
                                                        <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                                            <div>
                                                                <span className="text-xl font-bold text-amber-300">{w.thai}</span>
                                                                <p className="text-xs font-mono text-slate-400">{w.roman} ({w.tone})</p>
                                                                <p className="text-xs text-slate-200 mt-1">{w.zh}</p>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => speak(w.thai)} className="p-2 bg-slate-800 text-amber-400 rounded-xl"><IconVolume /></button>
                                                                <button onClick={() => toggleSaveWord(w)} className={`p-2 rounded-xl border ${saved ? 'bg-amber-400/20 text-amber-400 border-amber-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                                                    <IconBookmark />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* TAB 2: ALPHABET */}
                    {activeTab === 'alphabet' && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                            {CONSONANTS.map((c, idx) => (
                                <div key={idx} onClick={() => speak(c.char)} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-amber-400">
                                    <span className="text-3xl font-black text-amber-300 block mb-1">{c.char}</span>
                                    <p className="text-xs font-bold text-white">{c.name}</p>
                                    <p className="text-[10px] text-amber-400 mt-1">{c.class}</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 3: PHRASES */}
                    {activeTab === 'phrases' && (
                        <div className="space-y-6">
                            {CATEGORIZED_PHRASES.map((sec, idx) => (
                                <div key={idx} className="space-y-3">
                                    <h3 className="text-sm font-bold text-amber-400">{sec.category}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {sec.items.map((p, pIdx) => (
                                            <div key={pIdx} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                                <div>
                                                    <h4 className="text-lg font-bold text-white">{p.thai}</h4>
                                                    <p className="text-xs font-mono text-amber-300">{p.roman}</p>
                                                    <p className="text-xs text-slate-300 mt-1">{p.zh}</p>
                                                </div>
                                                <button onClick={() => speak(p.thai)} className="p-2.5 bg-slate-800 text-amber-400 rounded-xl"><IconVolume /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 4: TONES */}
                    {activeTab === 'tones' && (
                        <div className="space-y-3">
                            {TONE_GUIDES.map((t, idx) => (
                                <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                    <div>
                                        <h4 className="text-sm font-bold text-amber-300">{t.name} <span className="text-xs text-slate-400 font-mono font-normal">({t.pitch})</span></h4>
                                        <p className="text-xs text-slate-300 mt-1">標記符號: <span className="text-amber-400 font-mono">{t.mark}</span> | 例字: {t.sample}</p>
                                    </div>
                                    <button onClick={() => speak(t.sample.split(' ')[0])} className="p-2.5 bg-amber-400 text-slate-950 font-bold rounded-xl"><IconVolume /></button>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 5: SAVED */}
                    {activeTab === 'saved' && (
                        <div className="space-y-3">
                            {savedItems.length === 0 ? (
                                <p className="text-center text-slate-500 py-12">尚未收藏任何項目</p>
                            ) : (
                                savedItems.map((item) => (
                                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                        <div>
                                            <span className="text-[10px] bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded font-bold">{item.type === 'word' ? '單字' : '句子'}</span>
                                            <h4 className="text-xl font-bold text-white mt-1">{item.thai}</h4>
                                            <p className="text-xs text-slate-300">{item.zh}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => speak(item.thai)} className="p-2 bg-slate-800 text-amber-400 rounded-xl"><IconVolume /></button>
                                            <button onClick={() => {
                                                const u = savedItems.filter(i => i.id !== item.id);
                                                setSavedItems(u);
                                                localStorage.setItem('thai_easy_notes', JSON.stringify(u));
                                            }} className="p-2 bg-slate-800 text-rose-400 rounded-xl"><IconTrash /></button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
